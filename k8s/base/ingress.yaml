apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: routefinder-ingress
  labels:
    app.kubernetes.io/name: web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: routefinder.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
