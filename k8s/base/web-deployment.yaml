apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h "${DATABASE_HOST:-db}" -p "${DATABASE_PORT:-5432}" -U "${POSTGRES_USER:-postgres}"; do
                echo "Waiting for database ${DATABASE_HOST:-db}:${DATABASE_PORT:-5432} to become ready..."
                sleep 2
              done
              echo "Database is ready!"
          envFrom:
            - configMapRef:
                name: routefinder-config
            - secretRef:
                name: routefinder-secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      containers:
        - name: web
          image: ghcr.io/your-username/routefinder:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              python manage.py collectstatic --noinput && \
              python manage.py migrate --noinput && \
              python manage.py init_superuser && \
              gunicorn RouteFinder.wsgi:application --bind 0.0.0.0:8000 --timeout 120 --workers 4
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(POSTGRES_DB)"
          envFrom:
            - configMapRef:
                name: routefinder-config
            - secretRef:
                name: routefinder-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
